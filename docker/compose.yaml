# Unraid / Docker Compose
#
# lora-lab orchestrates only: ComfyUI renders on the GPU. Point COMFYUI_URL at
# the existing ComfyUI container (same Docker network) or its LAN address.
#
# The container paths below are a contract: keep them stable and put the real
# host paths on the left. See docs/PATHS.md.

services:
  lora-lab:
    image: ghcr.io/lum1nat0r/lora-lab:latest
    # local development: uncomment to build instead of pulling
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: lora-lab
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      COMFYUI_URL: ${COMFYUI_URL:-http://192.168.188.62:8188}
      COMFY_OUTPUT_DIR: /comfy-output
      LORA_LAB_DATA_DIR: /app/data
      # optional: local VLM judge (vLLM / llama.cpp / Ollama, OpenAI dialect)
      VLM_JUDGE_URL: ${VLM_JUDGE_URL:-}
      VLM_JUDGE_MODEL: ${VLM_JUDGE_MODEL:-}
      TZ: Europe/Vienna
    volumes:
      # required
      - /mnt/user/appdata/lora-lab/config:/app/config
      - /mnt/user/appdata/lora-lab/data:/app/data
      - /mnt/user/ai/training/datasets:/datasets:ro
      - /mnt/user/ai/models:/models:ro
      # Fizgig run history (training parameters, loss logs)
      - /mnt/user/ai/training/fizgig/Fizgig/user_data:/fizgig:ro
      # read rendered images from disk instead of over HTTP
      - /mnt/user/ai/output:/comfy-output:ro

# If lora-lab and ComfyUI are not on the same user-defined network, attach
# lora-lab to ComfyUI's network instead of using host addresses:
#
# networks:
#   default:
#     name: <comfyui-network-name>
#     external: true
