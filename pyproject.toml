[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lora-lab"
version = "0.2.0"
description = "Automated LoRA evaluation lab for ComfyUI (MOSS-Image first)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thomas Lumesberger" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
score = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.18",
]
web = []

[project.scripts]
lora-lab = "lora_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lora_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
